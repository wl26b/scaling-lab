# nginx site config. Installed to /etc/nginx/sites-available/app by deploy/install.sh.
upstream app {
    server 127.0.0.1:3000;
    keepalive 64;                     # reuse connections to Node
}

server {
    listen 80 default_server;
    access_log off;                   # per-request logging costs CPU at high req/s

    # The frontend: nginx serves these files straight from disk; Node never sees them.
    root /opt/app/current/public;
    location / {
        try_files $uri /index.html;
    }

    # The API (and health check): forwarded to Node.
    location ~ ^/(api/|health) {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
